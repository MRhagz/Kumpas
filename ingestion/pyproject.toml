[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kumpas-ingestion"
version = "0.1.0"
description = "Knowledge-base ingestion pipelines for Kumpas. Runs as scheduled GitHub Actions workflows; not deployed with the Next.js app."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "supabase>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
psa = [
    "pandas>=2.2,<3",
]
pdf = [
    "pdfplumber>=0.11,<1",
    "beautifulsoup4>=4.12,<5",
]
tesda = [
    "tabulate>=0.9,<1",
]
dev = [
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kumpas_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"
