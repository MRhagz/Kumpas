name: Correction log retention
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: contract-test
          POSTGRES_DB: sw08
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: psql -X -f supabase/tests/sw08_correction_logs.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: sw08
          PGPASSWORD: contract-test
      - run: npx vitest run --config vitest.config.ts tests/correction-logs.test.ts tests/reviewed-inputs.test.ts
      - run: npx eslint src/lib/module2/correction-audit.ts src/lib/module2/student-profile-builder.ts scripts/purge-correction-logs.mjs tests/correction-logs.test.ts
  cleanup:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/purge-correction-logs.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
