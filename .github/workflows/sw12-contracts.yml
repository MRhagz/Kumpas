name: SW-12 DOLE contracts

on:
  pull_request:
    paths:
      - "ingestion/**"
      - "supabase/**"
      - ".github/workflows/ingest-dole-ble.yml"
      - ".github/workflows/sw12-contracts.yml"
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  curated-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SW12_REQUIRE_OCR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install curated PDF and OCR test dependencies
        run: |
          # Keep the runner's official HTTPS mirrors and skip the slow Azure mirror.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update -qq
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils ghostscript
          pip install -e './ingestion[pdf,fixtures,dev]'
      - run: python -m unittest discover -s ingestion/tests/dole -p test_dole_curated.py -v
      - run: ruff check --config ingestion/pyproject.toml ingestion/src/kumpas_ingestion/pipelines/dole_ble.py ingestion/src/kumpas_ingestion/pdf_downloader.py ingestion/tests/dole

  database-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sw12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sw12"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOLE_TEST_DATABASE_URL: postgresql://postgres:fixture-only@localhost:5432/sw12
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: sw12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './ingestion[pdf,fixtures]' 'psycopg2-binary==2.9.13'
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/sw09_bootstrap.sql
      - run: python -m unittest discover -s ingestion/tests/dole -p test_dole_database.py -v
