name: Academic upload checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  upload-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:upload
      - run: npm run lint:upload
      - run: npx next typegen && npx tsc --noEmit --pretty false
