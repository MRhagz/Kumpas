name: Ingest CHED Memorandum Orders

# CHED's current site (ched.gov.ph) sits behind a CDN that returns 403
# to non-browser clients, but the legacy WordPress mirror at
# legacy.ched.gov.ph responds normally and exposes a stable per-year
# CMO index. This workflow scrapes that mirror weekly, downloads any
# newly published CMO PDFs, and ingests them into path_feasibility.

on:
  pull_request:
    paths:
      - "ingestion/**"
      - "supabase/tests/sw11_ched_cache.sql"
      - ".github/workflows/ingest-ched.yml"
  schedule:
    # Every Monday at 02:00 UTC (10:00 Manila). Off-hours, low traffic.
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      target_year:
        description: "Override target year (defaults to current UTC year)."
        required: false
        type: string
      first_run_limit:
        description: "Cap on publications processed when the cache is empty (default 10)."
        required: false
        type: string

concurrency:
  group: ingest-ched-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SW11_REQUIRE_OCR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml
      - name: Install PDF and OCR fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils ghostscript
          pip install -e './ingestion[pdf,fixtures,dev]'
      - run: python -m unittest discover -s ingestion/tests/ched -v
      - run: ruff check --config ingestion/pyproject.toml ingestion/src/kumpas_ingestion/pipelines/ched_cmo.py ingestion/src/kumpas_ingestion/publication_index_checker.py ingestion/src/kumpas_ingestion/pdf_downloader.py ingestion/src/kumpas_ingestion/pdf_text_extractor.py ingestion/tests/ched

  cache-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sw11
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sw11"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: sw11
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/sw09_bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/sw11_ched_cache.sql

  ingest:
    # PRs test public fixtures only; never expose production credentials or write a silo.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [fixtures, cache-contract]
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CHED_TARGET_YEAR: ${{ inputs.target_year }}
      CHED_FIRST_RUN_LIMIT: ${{ inputs.first_run_limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ingestion
        with:
          extras: pdf
      - name: Run CHED CMO ingestion
        run: python -m kumpas_ingestion.pipelines.ched_cmo
