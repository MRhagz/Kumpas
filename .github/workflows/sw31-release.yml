name: Integrated release regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: node --test scripts/release/metrics.test.mjs
      - run: node --check scripts/release/live-contracts.mjs
      - run: npx tsc --noEmit
  ingestion-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion/pyproject.toml
      - run: pip install -e './ingestion[pdf,psa,fixtures,dev]'
      # Database adapters are exercised by the existing disposable pgvector jobs.
      # This platform matrix covers the operator file/CLI path without credentials.
      - run: python -m unittest discover -s ingestion/tests -v
      - run: ruff check --config ingestion/pyproject.toml ingestion/src/kumpas_ingestion/pipelines/psa.py ingestion/tests/test_psa.py
