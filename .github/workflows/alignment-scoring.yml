name: Deterministic alignment scoring
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node_modules/.bin/vitest run --config vitest.config.ts tests/alignment*.test.ts tests/partial-specialists.test.ts tests/partial-specialists-ui.test.tsx tests/evidence*.test.ts
      - run: node_modules/.bin/tsc --noEmit --pretty false
      - run: node_modules/.bin/eslint src/lib/module3/alignment-score-calculator.ts src/lib/module3/synthesis-interpreter.ts src/lib/module3/ranking-agent.ts src/lib/module3/meta-agent-synthesizer.ts src/lib/module3/ranked-recommendation-builder.ts src/lib/module3/recommendation-provider.ts src/lib/module3/types.ts src/lib/report/types.ts src/lib/report/pdf-renderer.ts src/lib/report/evidence-summary.ts src/lib/report/reasoning-formatter.ts src/lib/report/audit-trail.ts src/lib/module5/session-state-manager.ts 'src/app/api/sessions/[sessionId]/analyze/route.ts' src/app/api/reports/route.ts src/components/analysis/report-download-view.tsx src/components/analysis/analysis-page.tsx src/components/analysis/error-view.tsx tests/alignment*.test.ts tests/evidence*.test.ts
      - run: node scripts/provider-e2e.mjs
