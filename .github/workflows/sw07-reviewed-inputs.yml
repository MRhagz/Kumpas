name: Reviewed input consistency
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reviewed-inputs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: contract-test
          POSTGRES_DB: sw07
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node_modules/.bin/vitest run --config vitest.config.ts tests/reviewed-inputs.test.ts tests/intake-ui.test.tsx tests/analysis-version-ui.test.tsx
      - run: python3 scripts/sw07-concurrency.py
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: sw07
          PGPASSWORD: contract-test
